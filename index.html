<!DOCTYPE html>
<html lang="zh-HK">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>今晚食乜餸！ What's For Dinner</title>
    <!-- Tailwind CSS CDN for sleek, fast styling -->
    <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>
    <!-- FontAwesome for clean icons -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
</head>
<body class="bg-slate-50 text-slate-800 font-sans antialiased min-h-screen flex flex-col">

    <!-- Header -->
    <header class="bg-red-600 text-white shadow-md py-6 px-4 text-center">
        <h1 class="text-3xl font-extrabold tracking-tight mb-1">💡 今晚食乜餸！</h1>
        <p class="text-red-100 text-sm">解決你每日最大嘅煩惱 • What's for Dinner?</p>
    </header>

    <!-- Main Content Container -->
    <main class="max-w-md w-full mx-auto px-4 py-6 flex-grow">
        
        <!-- Filter Selector -->
        <div class="bg-white rounded-2xl shadow-sm p-4 mb-6 border border-slate-100">
            <label class="block text-xs font-bold uppercase tracking-wider text-slate-400 mb-2">選擇菜式種類 / Cuisine</label>
            <div class="grid grid-cols-3 gap-2">
                <button onclick="setFilter('all')" id="btn-all" class="filter-btn py-2 px-3 text-sm font-semibold rounded-xl bg-slate-900 text-white transition-all cursor-pointer">
                    全部 (<span id="count-all">0</span>)
                </button>
                <button onclick="setFilter('Canton')" id="btn-Canton" class="filter-btn py-2 px-3 text-sm font-semibold rounded-xl bg-slate-100 text-slate-600 hover:bg-slate-200 transition-all cursor-pointer">
                    廣東菜 (<span id="count-Canton">0</span>)
                </button>
                <button onclick="setFilter('Western')" id="btn-Western" class="filter-btn py-2 px-3 text-sm font-semibold rounded-xl bg-slate-100 text-slate-600 hover:bg-slate-200 transition-all cursor-pointer">
                    西菜 (<span id="count-Western">0</span>)
                </button>
            </div>
        </div>

        <!-- The Big Randomizer Button -->
        <button onclick="gimmeFood()" class="w-full bg-red-500 hover:bg-red-600 active:scale-98 text-white font-bold text-lg py-4 px-6 rounded-2xl shadow-lg shadow-red-200 transition-all flex items-center justify-center gap-3 mb-6 cursor-pointer group">
            <i class="fa-solid fa-dice group-hover:rotate-180 transition-transform duration-500"></i> 幫我揀！ (Randomize)
        </button>

        <!-- Recipe Card Container (Hidden initially) -->
        <div id="recipe-card" class="hidden bg-white rounded-3xl shadow-md border border-slate-100 overflow-hidden transform transition-all duration-300">
            <!-- Card Badge & Title -->
            <div class="p-6 pb-4 border-b border-slate-50">
                <span id="card-tag" class="inline-block text-xs font-bold px-2.5 py-1 rounded-md bg-red-50 text-red-600 uppercase tracking-wide mb-3"></span>
                <h2 id="card-title" class="text-xl font-bold text-slate-900 leading-tight"></h2>
                <div class="flex items-center gap-4 mt-3 text-xs text-slate-400 font-medium">
                    <span><i class="fa-regular fa-clock mr-1"></i> <span id="card-time"></span></span>
                    <span><i class="fa-solid fa-utensils mr-1"></i> <span id="card-cat"></span></span>
                </div>
            </div>

            <!-- Card Body -->
            <div class="p-6 space-y-5">
                <!-- Ingredients -->
                <div>
                    <h3 class="text-sm font-bold text-slate-900 mb-2 flex items-center gap-2">
                        <span class="w-1.5 h-3.5 bg-red-500 rounded-full"></span> 材料 / Ingredients
                    </h3>
                    <ul id="card-ing" class="list-disc pl-5 text-sm text-slate-600 space-y-1 leading-relaxed"></ul>
                </div>

                <!-- Marinade/Sauce (Conditional) -->
                <div id="container-marinade">
                    <h3 class="text-sm font-bold text-slate-900 mb-2 flex items-center gap-2">
                        <span class="w-1.5 h-3.5 bg-amber-500 rounded-full"></span> 醃料/調味 / Seasoning
                    </h3>
                    <ul id="card-mar" class="list-disc pl-5 text-sm text-slate-600 space-y-1 leading-relaxed"></ul>
                </div>

                <!-- Steps -->
                <div>
                    <h3 class="text-sm font-bold text-slate-900 mb-2 flex items-center gap-2">
                        <span class="w-1.5 h-3.5 bg-emerald-500 rounded-full"></span> 做法 / Steps
                    </h3>
                    <ol id="card-steps" class="list-decimal pl-5 text-sm text-slate-600 space-y-2 leading-relaxed"></ol>
                </div>
            </div>
        </div>

    </main>

    <!-- Footer -->
    <footer class="text-center py-6 text-xs text-slate-400 border-t border-slate-100 bg-white">
        <p>© 2026 今晚食乜餸！ • Open Source on GitHub</p>
    </footer>

    <!-- App Logic -->
    <script>
        // Comprehensive Local Recipe Database
        const recipes = [
            // --- CANTONESE DISHES ---
            {
                name: "滑蛋蝦仁 (Velvety Scrambled Eggs with Shrimps)",
                cuisine: "Canton",
                category: "海鮮/速炒小炒",
                time: "15 mins",
                ingredients: ["鮮蝦/蝦仁 150g", "雞蛋 4隻", "蔥花 適量"],
                marinade: ["鹽 1/2 茶匙", "胡椒粉 少許", "紹興酒 1茶匙 (醃蝦用)"],
                steps: ["蝦仁洗淨抹乾，加入調味醃10分鐘。", "大火落油落蝦仁炒至8成熟，撈起備用。", "打散雞蛋加入蔥花，放入蝦仁。", "中慢火落鑊，用推鏟手法炒至蛋液剛凝固即成。"]
            },
            {
                name: "豉椒炒牛肉 (Wok-Fried Beef with Bell Peppers)",
                cuisine: "Canton",
                category: "肉類/鑊氣小炒",
                time: "20 mins",
                ingredients: ["牛肉片 200g", "青椒、紅椒 各1隻", "蒜頭 2瓣(切碎)", "豆豉 1湯匙"],
                marinade: ["生抽 1湯匙", "生粉 1茶匙", "糖 1/2 茶匙", "油 1茶匙"],
                steps: ["牛肉用醃料醃15分鐘；青紅椒切塊。", "大火爆炒青紅椒至斷生，撈起。", "熱鑊下油，爆香蒜蓉及豆豉，下牛肉大火快炒至轉色。", "加入青紅椒，落少許生抽、糖調味，兜勻即可出鑊。"]
            },
            {
                name: "上湯金銀蛋莧菜 (Amaranth in Gold-Silver Egg Broth)",
                cuisine: "Canton",
                category: "蔬菜/湯浸大熱",
                time: "20 mins",
                ingredients: ["莧菜 300g", "鹹蛋 1隻", "皮蛋 1隻", "蒜頭 3瓣", "高湯/清水 400ml"],
                marinade: [],
                steps: ["莧菜洗淨摘好；皮蛋及鹹蛋黃切件，鹹蛋白拌勻；蒜頭拍碎。", "落油爆香蒜頭，加入高湯煮滾。", "放入莧菜煮至軟身。", "加入皮蛋、鹹蛋黃件，最後淋入鹹蛋白煮熟，落少許鹽調味即可。"]
            },
            {
                name: "土魷馬蹄蒸肉餅 (Steaped Pork Patty with Dried Squid)",
                cuisine: "Canton",
                category: "肉類/家庭經典蒸菜",
                time: "25 mins",
                ingredients: ["半肥瘦豬肉碎 250g", "土魷魚 (乾魷魚) 1/2隻", "馬蹄 4粒", "蔥花 少許"],
                marinade: ["生抽 1湯匙", "生粉 1.5茶匙", "糖 1/2茶匙", "水 2湯匙", "麻油 1茶匙"],
                steps: ["土魷魚浸軟切細絲；馬蹄去皮拍碎切丁。", "豬肉碎加入生抽、糖、生粉及分次加入2湯匙水，順時針大力攪拌至起膠。", "加入土魷絲及馬蹄碎拌勻，平鋪在蒸碟上（中央稍微挖凹）。", "大火隔水蒸 10-12 分鐘，出鑊後撒上蔥花即可。"]
            },
            {
                name: "豉汁蒸排骨 (Steamed Pork Ribs with Black Bean Sauce)",
                cuisine: "Canton",
                category: "肉類/酒樓飲茶風味",
                time: "20 mins",
                ingredients: ["細排骨 300g", "蒜頭 3瓣 (切碎)", "豆豉 1湯匙 (壓碎)", "紅椒絲 少許"],
                marinade: ["生抽 1湯匙", "砂糖 1/2茶匙", "生粉 1.5茶匙", "料酒 1茶匙", "油 1湯匙 (最後才加)"],
                steps: ["排骨用清水浸泡洗淨，徹底用廚房紙抹乾水分（關鍵：乾身才會爽口）。", "加入蒜蓉、豆豉、生抽、糖、料酒及生粉拌勻醃製15分鐘，最後落油鎖汁。", "將排骨平鋪在碟上（盡量不要重疊），鋪上紅椒絲。", "大火隔水蒸 12-15 分鐘至全熟。"]
            },
            {
                name: "沙茶肥牛金菇粉絲煲 (Satay Beef Vermicelli Claypot)",
                cuisine: "Canton",
                category: "肉類/香濃煲仔菜",
                time: "20 mins",
                ingredients: ["火鍋肥牛片 200g", "金菇 1包", "粉絲 1包", "蒜蓉 1湯匙", "乾蔥頭 2粒"],
                marinade: ["沙茶醬 2湯匙", "醬油 1湯匙", "蠔油 1茶匙", "糖 1/2茶匙", "清水 200ml (調成醬汁)"],
                steps: ["粉絲用溫水浸軟剪開；金菇切去根部撕開洗淨。", "熱鑊下油，爆香蒜蓉及乾蔥頭，下金菇略炒。", "加入粉絲及調好的沙茶醬汁，煮滾後轉中小火縮汁2分鐘。", "鋪上肥牛片，蓋上鑊蓋燜煮1-2分鐘至肥牛剛熟，撒上蔥花原煲上檯。"]
            },

            // --- WESTERN DISHES ---
            {
                name: "香草蒜香煎肉眼牛扒 (Garlic Herb Ribeye Steak)",
                cuisine: "Western",
                category: "主菜/高級肉類",
                time: "15 mins",
                ingredients: ["肉眼牛扒 1塊", "牛油 30g", "原粒大蒜 3瓣", "新鮮迷迭香 2棵"],
                marinade: ["粗鹽 適量", "現磨黑胡椒 大量"],
                steps: ["牛扒提前30分鐘退冰，用廚房紙完全抹乾表面。", "下鑊前兩面撒上大量粗鹽及黑胡椒。", "下少許油落熱鑊，大火每面各煎約1-2分鐘以鎖住肉汁。", "加入牛油、大蒜及迷迭香，轉中火，不斷將融化的牛油澆淋在牛扒表面（Basting），起鑊後靜置（Rest）5分鐘。"]
            },
            {
                name: "蒜香辣椒炒意粉 (Spaghetti Aglio e Olio)",
                cuisine: "Western",
                category: "意粉/經典主食",
                time: "20 mins",
                ingredients: ["意大利粉 100g", "優質橄欖油 3湯匙", "蒜頭 4瓣 (切片)", "乾辣椒絲 1茶匙", "新鮮番茜 適量"],
                marinade: [],
                steps: ["大滾水加鹽，放入意粉煮至 al dente，撈起保留意粉水。", "冷鑊落橄欖油及蒜片，慢火編炒至蒜片邊緣微黃、香氣釋出。", "加入乾辣椒絲炒香，倒進1勺意粉水，搖動平底鑊使油水乳化。", "放入意粉及碎番茜，大火快速拌炒至汁底濃稠包裹意粉即可。"]
            },
            {
                name: "法式紅酒燉牛肉 (Classic Beef Bourguignon)",
                cuisine: "Western",
                category: "主菜/傳統慢燉",
                time: "120 mins",
                ingredients: ["牛肋肉/牛腩 500g", "煙肉 2條", "甘筍 1條", "洋蔥 1個", "蘑菇 100g", "蒜頭 2瓣"],
                marinade: ["平價紅酒 400ml", "番茄膏 1湯匙", "麵粉 1湯匙", "百里香 2棵", "月桂葉 2片"],
                steps: ["牛肉切大塊抹乾，撒鹽及黑椒；煙肉、甘筍、洋蔥切塊。", "下煙肉爆出油分撈起，用原油將牛肉四面煎至金黃焦香，撈起。", "下洋蔥、甘筍、蒜頭炒香，落番茄膏及麵粉炒勻。", "倒回牛肉，注入紅酒及少許高湯，放入香草。小火蓋蓋慢火燉1.5至2小時。", "最後30分鐘加入炒香的蘑菇，燉至牛肉入口即化，大火稍微收濃汁底。"]
            },
            {
                name: "意式香草烤春雞配薯仔 (Garlic Herb Roasted Whole Chicken)",
                cuisine: "Western",
                category: "主菜/家庭焗爐料理",
                time: "60 mins",
                ingredients: ["春雞 1隻", "細薯仔 4粒 (切塊)", "南瓜/甘筍 適量", "蒜頭 1整個 (打橫切半)"],
                marinade: ["軟化牛油 40g", "黑胡椒/粗鹽 適量", "蒜粉 1茶匙", "乾百里香/迷迭香 各1茶匙"],
                steps: ["春雞洗淨，用廚房紙徹底抹乾內外水分（皮乾才會脆）。", "將軟化牛油與鹽、黑椒、蒜粉及香草混合，均勻抹在雞皮表面及塞入雞腔內。", "薯仔及蔬菜塊用橄欖油、鹽、黑椒拌勻，鋪在焗盤底部，放上春雞。", "放入已預熱至 200°C 的焗爐，焗 45-50 分鐘至雞皮金黃酥脆即可。"]
            },
            {
                name: "香煎三文魚配檸檬牛油刁草汁 (Pan-Seared Salmon with Dill Sauce)",
                cuisine: "Western",
                category: "海鮮/健康主菜",
                time: "15 mins",
                ingredients: ["帶皮三文魚柳 1塊", "新鮮刁草 少許", "檸檬 1/2個", "冷牛油 20g"],
                marinade: ["海鹽 少許", "黑胡椒碎 適量", "橄欖油 1茶匙"],
                steps: ["三文魚表面抹乾，魚皮上用刀劃出幾道淺痕防止捲曲，兩面撒上鹽及黑椒。", "下少許橄欖油落平底鑊，中火落魚，魚皮朝下，輕壓魚身20秒確保緊貼鑊底。", "保持魚皮朝下慢煎約4-5分鐘，翻面再煎1分鐘，起鑊。", "原鑊轉小火，加入冷牛油、擠入檸檬汁及撒入刁草碎，快速搖動平底鑊成乳白醬汁，淋在魚身。"]
            }
        ];

        let currentFilter = 'all';

        // Update the category counter badges on page load
        function updateCounters() {
            const total = recipes.length;
            const cantonCount = recipes.filter(r => r.cuisine === 'Canton').length;
            const westernCount = recipes.filter(r => r.cuisine === 'Western').length;

            document.getElementById('count-all').innerText = total;
            document.getElementById('count-Canton').innerText = cantonCount;
            document.getElementById('count-Western').innerText = westernCount;
        }

        // Filter Toggle Handler
        function setFilter(type) {
            currentFilter = type;
            document.querySelectorAll('.filter-btn').forEach(btn => {
                btn.classList.remove('bg-slate-900', 'text-white');
                btn.classList.add('bg-slate-100', 'text-slate-600', 'hover:bg-slate-200');
            });
            
            const activeBtn = document.getElementById(`btn-${type}`);
            activeBtn.classList.remove('bg-slate-100', 'text-slate-600', 'hover:bg-slate-200');
            activeBtn.classList.add('bg-slate-900', 'text-white');
        }

        // Random Selection Logic
        function gimmeFood() {
            const filtered = recipes.filter(r => currentFilter === 'all' || r.cuisine === currentFilter);
            const randomDish = filtered[Math.floor(Math.random() * filtered.length)];
            
            renderRecipe(randomDish);
        }

        // Render Data into UI Cards
        function renderRecipe(dish) {
            const card = document.getElementById('recipe-card');
            
            // UI text bindings
            document.getElementById('card-tag').innerText = dish.cuisine === 'Canton' ? '廣東家常菜 • Cantonese' : '西方美饌 • Western Cuisine';
            
            // Dynamically alter badge colors depending on the cuisine type
            if(dish.cuisine === 'Canton') {
                document.getElementById('card-tag').className = "inline-block text-xs font-bold px-2.5 py-1 rounded-md bg-red-50 text-red-600 uppercase tracking-wide mb-3";
            } else {
                document.getElementById('card-tag').className = "inline-block text-xs font-bold px-2.5 py-1 rounded-md bg-blue-50 text-blue-600 uppercase tracking-wide mb-3";
            }

            document.getElementById('card-title').innerText = dish.name;
            document.getElementById('card-time').innerText = dish.time;
            document.getElementById('card-cat').innerText = dish.category;

            // Render lists cleanly
            renderList('card-ing', dish.ingredients);
            renderList('card-steps', dish.steps);

            // Handle seasoning displays only if available
            const marContainer = document.getElementById('container-marinade');
            if (dish.marinade && dish.marinade.length > 0) {
                marContainer.classList.remove('hidden');
                renderList('card-mar', dish.marinade);
            } else {
                marContainer.classList.add('hidden');
            }

            // Smooth reveal transition logic
            card.classList.remove('hidden');
            card.scrollIntoView({ behavior: 'smooth', block: 'nearest' });
        }

        function renderList(elementId, items) {
            const el = document.getElementById(elementId);
            el.innerHTML = items.map(item => `<li>${item}</li>`).join('');
        }

        // Initial setup run
        updateCounters();
    </script>
</body>
</html>
