<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">

    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Orbitron:wght@400;500;700&amp;family=Roboto+Mono:wght@400;500&amp;display=swap');
        
        :root {
            --primary: #00ff9d;
        }
        
        body {
            font-family: 'Roboto Mono', monospace;
            background: #0a0a0a;
            color: #e0e0e0;
            overflow-x: hidden;
        }
        
        .header-font {
            font-family: 'Orbitron', sans-serif;
        }

        .scanline {
            position: relative;
        }
        
        .scanline::after {
            content: '';
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: linear-gradient(
                to bottom,
                transparent 50%,
                rgba(0, 255, 157, 0.03) 50%
            );
            background-size: 100% 4px;
            pointer-events: none;
            animation: scan 4s linear infinite;
        }

        @keyframes scan {
            0% { background-position: 0 0; }
            100% { background-position: 0 400px; }
        }

        .neon-text {
            text-shadow: 
                0 0 5px var(--primary),
                0 0 10px var(--primary),
                0 0 20px var(--primary);
        }

        .terminal {
            background: #111;
            border: 1px solid #00ff9d;
            box-shadow: 0 0 15px rgba(0, 255, 157, 0.3);
        }

        .nav-link {
            position: relative;
            transition: all 0.3s ease;
        }
        
        .nav-link:after {
            content: '';
            position: absolute;
            width: 0;
            height: 2px;
            bottom: -4px;
            left: 0;
            background-color: #00ff9d;
            transition: width 0.3s ease;
        }
        
        .nav-link:hover:after {
            width: 100%;
        }

        .section-header {
            position: relative;
            display: inline-block;
        }
        
        .section-header:after {
            content: '';
            position: absolute;
            width: 60%;
            height: 3px;
            background: linear-gradient(to right, #00ff9d, transparent);
            bottom: -8px;
            left: 0;
        }

        .timeline-item {
            transition: all 0.4s cubic-bezier(0.4, 0, 0.2, 1);
        }
        
        .timeline-item:hover {
            transform: translateX(15px);
            box-shadow: 0 0 25px rgba(0, 255, 157, 0.2);
        }

        .skill-bar {
            height: 8px;
            background: #1a1a1a;
            border-radius: 9999px;
            overflow: hidden;
        }
        
        .skill-progress {
            height: 100%;
            background: linear-gradient(90deg, #00ff9d, #00cc7a);
            transition: width 1.5s cubic-bezier(0.34, 1.56, 0.64, 1);
        }

        .lock-icon {
            animation: pulse-lock 2s infinite;
        }

        @keyframes pulse-lock {
            0%, 100% { transform: scale(1); }
            50% { transform: scale(1.15); }
        }

        .matrix-bg {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            z-index: -1;
            opacity: 0.08;
            pointer-events: none;
            background-image: 
                linear-gradient(#00ff9d 1px, transparent 1px),
                linear-gradient(90deg, #00ff9d 1px, transparent 1px);
            background-size: 50px 50px;
            animation: matrix-fall 25s linear infinite;
        }

        @keyframes matrix-fall {
            0% { background-position: 0 0; }
            100% { background-position: 0 500px; }
        }
    </style>
</head>
