<!DOCTYPE html>
<html lang="zh-HK">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>今晚食乜餸！ What's For Dinner</title>
    <!-- Tailwind CSS CDN for sleek, fast styling -->
    <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>
    <!-- FontAwesome for clean icons -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
</head>
<body class="bg-slate-50 text-slate-800 font-sans antialiased min-h-screen flex flex-col">

    <!-- Header -->
    <header class="bg-red-600 text-white shadow-md py-6 px-4 text-center">
        <h1 class="text-3xl font-extrabold tracking-tight mb-1">💡 今晚食乜餸！</h1>
        <p class="text-red-100 text-sm">解決你每日最大嘅煩惱 • What's for Dinner?</p>
    </header>

    <!-- Main Content Container -->
    <main class="max-w-md w-full mx-auto px-4 py-6 flex-grow">
        
        <!-- Filter Selector -->
        <div class="bg-white rounded-2xl shadow-sm p-4 mb-6 border border-slate-100">
            <label class="block text-xs font-bold uppercase tracking-wider text-slate-400 mb-2">選擇菜式種類 / Cuisine</label>
            <div class="grid grid-cols-3 gap-2">
                <button onclick="setFilter('all')" id="btn-all" class="filter-btn py-2 px-3 text-sm font-semibold rounded-xl bg-slate-900 text-white transition-all">
                    全部
                </button>
                <button onclick="setFilter('Canton')" id="btn-Canton" class="filter-btn py-2 px-3 text-sm font-semibold rounded-xl bg-slate-100 text-slate-600 hover:bg-slate-200 transition-all">
                    廣東菜
                </button>
                <button onclick="setFilter('Western')" id="btn-Western" class="filter-btn py-2 px-3 text-sm font-semibold rounded-xl bg-slate-100 text-slate-600 hover:bg-slate-200 transition-all">
                    西菜
                </button>
            </div>
        </div>

        <!-- The Big Randomizer Button -->
        <button onclick="gimmeFood()" class="w-full bg-red-500 hover:bg-red-600 active:scale-98 text-white font-bold text-lg py-4 px-6 rounded-2xl shadow-lg shadow-red-200 transition-all flex items-center justify-center gap-3 mb-6">
            <i class="fa-solid solid fa-dice"></i> 幫我揀！ (Randomize)
        </button>

        <!-- Recipe Card Container (Hidden initially) -->
        <div id="recipe-card" class="hidden bg-white rounded-3xl shadow-md border border-slate-100 overflow-hidden transform transition-all duration-300">
            <!-- Card Badge & Title -->
            <div class="p-6 pb-4 border-b border-slate-50">
                <span id="card-tag" class="inline-block text-xs font-bold px-2.5 py-1 rounded-md bg-red-50 text-red-600 uppercase tracking-wide mb-3"></span>
                <h2 id="card-title" class="text-xl font-bold text-slate-900 leading-tight"></h2>
                <div class="flex items-center gap-4 mt-3 text-xs text-slate-400 font-medium">
                    <span><i class="fa-regular fa-clock mr-1"></i> <span id="card-time"></span></span>
                    <span><i class="fa-solid fa-utensils mr-1"></i> <span id="card-cat"></span></span>
                </div>
            </div>

            <!-- Card Body -->
            <div class="p-6 space-y-5">
                <!-- Ingredients -->
                <div>
                    <h3 class="text-sm font-bold text-slate-900 mb-2 flex items-center gap-2">
                        <span class="w-1.5 h-3.5 bg-red-500 rounded-full"></span> 材料 / Ingredients
                    </h3>
                    <ul id="card-ing" class="list-disc pl-5 text-sm text-slate-600 space-y-1"></ul>
                </div>

                <!-- Marinade/Sauce (Conditional) -->
                <div id="container-marinade">
                    <h3 class="text-sm font-bold text-slate-900 mb-2 flex items-center gap-2">
                        <span class="w-1.5 h-3.5 bg-amber-500 rounded-full"></span> 醃料/調味 / Seasoning
                    </h3>
                    <ul id="card-mar" class="list-disc pl-5 text-sm text-slate-600 space-y-1"></ul>
                </div>

                <!-- Steps -->
                <div>
                    <h3 class="text-sm font-bold text-slate-900 mb-2 flex items-center gap-2">
                        <span class="w-1.5 h-3.5 bg-emerald-500 rounded-full"></span> 做法 / Steps
                    </h3>
                    <ol id="card-steps" class="list-decimal pl-5 text-sm text-slate-600 space-y-2"></ol>
                </div>
            </div>
        </div>

    </main>

    <!-- Footer -->
    <footer class="text-center py-6 text-xs text-slate-400 border-t border-slate-100 bg-white">
        <p>© 2026 今晚食乜餸！ • Open Source on GitHub</p>
    </footer>

    <!-- App Logic -->
    <script>
        // Local Embedded Recipe Database
        const recipes = [
            {
                name: "滑蛋蝦仁 (Velvety Scrambled Eggs with Shrimps)",
                cuisine: "Canton",
                category: "海鮮/小炒",
                time: "15 mins",
                ingredients: ["鮮蝦/蝦仁 150g", "雞蛋 4隻", "蔥花 適量"],
                marinade: ["鹽 1/2 茶匙", "胡椒粉 少許", "紹興酒 1茶匙 (醃蝦用)"],
                steps: ["蝦仁洗淨抹乾，加入調味醃10分鐘。", "大火落油落蝦仁炒至8成熟，撈起備用。", "打散雞蛋加入蔥花，放入蝦仁。", "中慢火落鑊，用推鏟手法炒至蛋液剛凝固即成。"]
            },
            {
                name: "豉椒炒牛肉 (Wok-Fried Beef with Bell Peppers)",
                cuisine: "Canton",
                category: "肉類/鑊氣小炒",
                time: "20 mins",
                ingredients: ["牛肉片 200g", "青椒、紅椒 各1隻", "蒜頭 2瓣(切碎)", "豆豉 1湯匙"],
                marinade: ["生抽 1湯匙", "生粉 1茶匙", "糖 1/2 茶匙", "油 1茶匙"],
                steps: ["牛肉用醃料醃15分鐘；青紅椒切塊。", "大火爆炒青紅椒至斷生，撈起。", "熱鑊下油，爆香蒜蓉及豆豉，下牛肉大火快炒至轉色。", "加入青紅椒，落少許生抽、糖調味，兜勻即可出鑊。"]
            },
            {
                name: "上湯金銀蛋莧菜 (Amaranth in Gold-Silver Egg Broth)",
                cuisine: "Canton",
                category: "蔬菜/湯浸",
                time: "20 mins",
                ingredients: ["莧菜 300g", "鹹蛋 1隻", "皮蛋 1隻", "蒜頭 3瓣", "高湯/清水 400ml"],
                marinade: [],
                steps: ["莧菜洗淨摘好；皮蛋及鹹蛋黃切件，鹹蛋白拌勻；蒜頭拍碎。", "落油爆香蒜頭，加入高湯煮滾。", "放入莧菜煮至軟身。", "加入皮蛋、鹹蛋黃件，最後淋入鹹蛋白煮熟，落少許鹽調味即可。"]
            },
            {
                name: "香草蒜香煎肉眼牛扒 (Garlic Herb Ribeye Steak)",
                cuisine: "Western",
                category: "主菜/Premium Meat",
                time: "15 mins",
                ingredients: ["肉眼牛扒 (Ribeye) 1塊", "牛油 30g", "原粒大蒜 3瓣", "新鮮迷迭香 (Rosemary) 2棵"],
                marinade: ["粗鹽 (Kosher Salt) 適量", "現磨黑胡椒 大量"],
                steps: ["牛扒提前30分鐘由雪櫃取出退冰，用廚房紙完全抹乾表面。", "下鑊前兩面撒上大量粗鹽及黑胡椒。", "下少許油落熱鑊，大火每面各煎約1-2分鐘（視乎厚度）以鎖住肉汁。", "加入牛油、大蒜及迷迭香，轉中火，不斷將融化的牛油淋在牛扒表面（Basting），起鑊後靜置（Rest）5分鐘。"]
            },
            {
                name: "蒜香辣椒炒意粉 (Spaghetti Aglio e Olio)",
                cuisine: "Western",
                category: "意粉/主食",
                time: "20 mins",
                ingredients: ["意大利粉 (Spaghetti) 100g", "優質橄欖油 3湯匙", "蒜頭 4瓣 (切薄片)", "乾辣椒絲/碎 1茶匙", "新鮮番茜 (Parsley) 適量"],
                marinade: [],
                steps: ["大滾水加鹽，放入意粉煮至 al dente (比包裝說明少1-2分鐘)，撈起保留意粉水。", "冷鑊落橄欖油及蒜片，慢火煸炒至蒜片邊緣微黃、香氣釋出。", "加入乾辣椒絲炒香，倒進1勺意粉水，搖動平底鑊使油水乳化 (Emulsify)。", "放入意粉及碎番茜，大火快速拌炒至汁底濃稠包裹意粉即可。"]
            }
        ];

        let currentFilter = 'all';

        // Filter Toggle Handler
        function setFilter(type) {
            currentFilter = type;
            document.querySelectorAll('.filter-btn').forEach(btn => {
                btn.classList.remove('bg-slate-900', 'text-white');
                btn.classList.add('bg-slate-100', 'text-slate-600', 'hover:bg-slate-200');
            });
            
            const activeBtn = document.getElementById(`btn-${type}`);
            activeBtn.classList.remove('bg-slate-100', 'text-slate-600', 'hover:bg-slate-200');
            activeBtn.classList.add('bg-slate-900', 'text-white');
        }

        // Random Selection Logic
        function gimmeFood() {
            const filtered = recipes.filter(r => currentFilter === 'all' || r.cuisine === currentFilter);
            const randomDish = filtered[Math.floor(Math.random() * filtered.length)];
            
            renderRecipe(randomDish);
        }

        // Render UI
        function renderRecipe(dish) {
            const card = document.getElementById('recipe-card');
            
            // Text values
            document.getElementById('card-tag').innerText = dish.cuisine === 'Canton' ? '廣東家常菜' : 'Western Standard';
            document.getElementById('card-title').innerText = dish.name;
            document.getElementById('card-time').innerText = dish.time;
            document.getElementById('card-cat').innerText = dish.category;

            // Render lists
            renderList('card-ing', dish.ingredients);
            renderList('card-steps', dish.steps);

            // Handle conditional seasoning display
            const marContainer = document.getElementById('container-marinade');
            if (dish.marinade && dish.marinade.length > 0) {
                marContainer.classList.remove('hidden');
                renderList('card-mar', dish.marinade);
            } else {
                marContainer.classList.add('hidden');
            }

            // Reveal Animation
            card.classList.remove('hidden', 'opacity-0', 'translate-y-4');
            card.classList.add('opacity-100', 'translate-y-0');
        }

        function renderList(elementId, items) {
            const el = document.getElementById(elementId);
            el.innerHTML = items.map(item => `<li>${item}</li>`).join('');
        }
    </script>
</body>
</html>
